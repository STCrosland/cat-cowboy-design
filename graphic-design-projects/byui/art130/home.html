
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="home-page-for-course-art130">
    <meta name="author" content="Spencer-T.-Crosland">

    <title>Introduction To Graphic Design Home Page</title>

    <link rel="stylesheet" href="art130.css">
    <script defer src="art130.js"></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Introduction to Graphic Design</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="home.html">HOME</a>
        <a href="projects.html">PROJECTS</a>
        <a href="about.html">ABOUT THE COURSE</a>
    </nav>

    <main>

        <!-- Welcome Message -->
        <section class="welcome-message">
            <h2>Welcome to My Graphic Design Portfolio</h2>
            <p>
                Explore my completed projects from Introduction to Graphic Design.
                Click on a project image to view an enlarged version.
            </p>
        </section>

        <!-- Finished Projects -->
        <section class="gallery">

            <!-- Album Project -->
            <figure class="project-card">

                <img
                    src="images/finished-album.jpg"
                    alt="Completed album design project"
                    class="project-image"
                >

                <figcaption>
                    <h2>Album Project</h2>
                    <p>
                        My completed album design project.
                    </p>
                </figcaption>

            </figure>

            <!-- Logo Project -->
            <figure class="project-card">

                <img
                    src="images/finished-logo.jpg"
                    alt="Completed logo design project"
                    class="project-image"
                >

                <figcaption>
                    <h2>Logo Project</h2>
                    <p>
                        My completed logo design project.
                    </p>
                </figcaption>

            </figure>

            <!-- Poster Project -->
            <figure class="project-card">

                <img
                    src="images/finished-poster.jpg"
                    alt="Completed poster design project"
                    class="project-image"
                >

                <figcaption>
                    <h2>Poster Project</h2>
                    <p>
                        My completed poster design project.
                    </p>
                </figcaption>

            </figure>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <a href="../../../home.html">
            <img
                src="../../../images/styling/logo.jpg"
                alt="Red, green, and blue hexagon logo"
            >
        </a>

        <p>&copy; 2026 Spencer T. Crosland</p>

    </footer>

</body>
</html>
